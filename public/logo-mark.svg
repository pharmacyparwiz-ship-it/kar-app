<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#12181B"/>
  <!-- Geometric mark: a vertical spine with two diagonal arms and a
       detached dot, reading simultaneously as an abstracted Persian ک
       (kāf, first letter of "کار") and a bold Latin K for "Kar". -->
  <path
    d="M 21 13 L 21 51"
    stroke="#D4A356"
    stroke-width="5.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 24 33.5 L 41 18"
    stroke="#D4A356"
    stroke-width="5.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 23 32 L 43 51"
    stroke="#B8863B"
    stroke-width="5.5"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="45" cy="14" r="4" fill="#D4A356"/>
</svg>
